name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-syntax:
    name: Python syntax (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The pinned requirements.txt (2020) doesn't install on current Python;
      # until it's refreshed, CI checks that every script compiles.
      - name: Compile every Python file
        run: python -m compileall -q -f Python
